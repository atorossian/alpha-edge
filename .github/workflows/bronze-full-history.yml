name: Bronze full-history S3 ingestion

on:
  push:
    branches:
      - feature/bronze-full-history-s3
      - feature/aea90-contract-integration
    paths:
      - "data/universe/*.csv"
      - "src/alpha_edge/market/lakehouse_v3/**"
      - "src/alpha_edge/universe/universe.py"
      - "src/alpha_edge/market/snapshot_bronze_universe.py"
      - "src/alpha_edge/market/build_silver_financial_v3.py"
      - "src/alpha_edge/market/silver_financial_evidence_v3.py"
      - "src/alpha_edge/market/calendar_registry_v3.py"
      - "src/alpha_edge/market/build_silver_sessions_v3.py"
      - "src/alpha_edge/market/ingest_bronze_incremental.py"
      - "src/alpha_edge/market/ingest_bronze_full_history.py"
      - "tests/unit/test_universe_enrich_currency_preservation.py"
      - "tests/unit/test_snapshot_bronze_universe.py"
      - "tests/unit/test_build_silver_financial_v3.py"
      - "tests/unit/test_silver_financial_evidence_v3.py"
      - "tests/unit/test_calendar_registry_v3.py"
      - "tests/unit/test_build_silver_sessions_v3.py"
      - "tests/unit/test_ingest_bronze_incremental.py"
      - "tests/unit/test_ingest_bronze_full_history.py"
      - ".github/workflows/bronze-full-history.yml"
  pull_request:
    paths:
      - "data/universe/*.csv"
      - "src/alpha_edge/market/lakehouse_v3/**"
      - "src/alpha_edge/universe/universe.py"
      - "src/alpha_edge/market/snapshot_bronze_universe.py"
      - "src/alpha_edge/market/build_silver_financial_v3.py"
      - "src/alpha_edge/market/silver_financial_evidence_v3.py"
      - "src/alpha_edge/market/calendar_registry_v3.py"
      - "src/alpha_edge/market/build_silver_sessions_v3.py"
      - "src/alpha_edge/market/ingest_bronze_incremental.py"
      - "src/alpha_edge/market/ingest_bronze_full_history.py"
      - "tests/unit/test_universe_enrich_currency_preservation.py"
      - "tests/unit/test_snapshot_bronze_universe.py"
      - "tests/unit/test_build_silver_financial_v3.py"
      - "tests/unit/test_silver_financial_evidence_v3.py"
      - "tests/unit/test_calendar_registry_v3.py"
      - "tests/unit/test_build_silver_sessions_v3.py"
      - "tests/unit/test_ingest_bronze_incremental.py"
      - "tests/unit/test_ingest_bronze_full_history.py"
      - ".github/workflows/bronze-full-history.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Test S3-only Bronze ingestion
        run: poetry run pytest -q tests/unit/test_ingest_bronze_full_history.py tests/unit/test_ingest_bronze_yahoo_v2.py tests/unit/test_universe_enrich_currency_preservation.py tests/unit/test_snapshot_bronze_universe.py tests/unit/test_ingest_bronze_incremental.py tests/unit/test_build_silver_sessions_v3.py tests/unit/test_calendar_registry_v3.py tests/unit/test_silver_financial_evidence_v3.py tests/unit/test_build_silver_financial_v3.py
      - name: Enforce S3-only data-plane code contracts
        run: poetry run python -m alpha_edge.market.lakehouse_v3.guardrails
      - name: Lint and format
        run: |
          poetry run ruff check --no-fix src/alpha_edge/market/ingest_bronze_full_history.py tests/unit/test_ingest_bronze_full_history.py src/alpha_edge/universe/universe.py tests/unit/test_universe_enrich_currency_preservation.py src/alpha_edge/market/snapshot_bronze_universe.py tests/unit/test_snapshot_bronze_universe.py src/alpha_edge/market/ingest_bronze_incremental.py tests/unit/test_ingest_bronze_incremental.py src/alpha_edge/market/build_silver_sessions_v3.py tests/unit/test_build_silver_sessions_v3.py src/alpha_edge/market/calendar_registry_v3.py tests/unit/test_calendar_registry_v3.py src/alpha_edge/market/silver_financial_evidence_v3.py tests/unit/test_silver_financial_evidence_v3.py src/alpha_edge/market/build_silver_financial_v3.py tests/unit/test_build_silver_financial_v3.py
          poetry run ruff format --diff src/alpha_edge/market/ingest_bronze_full_history.py tests/unit/test_ingest_bronze_full_history.py src/alpha_edge/universe/universe.py tests/unit/test_universe_enrich_currency_preservation.py src/alpha_edge/market/snapshot_bronze_universe.py tests/unit/test_snapshot_bronze_universe.py src/alpha_edge/market/ingest_bronze_incremental.py tests/unit/test_ingest_bronze_incremental.py src/alpha_edge/market/build_silver_sessions_v3.py tests/unit/test_build_silver_sessions_v3.py src/alpha_edge/market/calendar_registry_v3.py tests/unit/test_calendar_registry_v3.py src/alpha_edge/market/silver_financial_evidence_v3.py tests/unit/test_silver_financial_evidence_v3.py src/alpha_edge/market/build_silver_financial_v3.py tests/unit/test_build_silver_financial_v3.py
          poetry run ruff format --check src/alpha_edge/market/ingest_bronze_full_history.py tests/unit/test_ingest_bronze_full_history.py src/alpha_edge/universe/universe.py tests/unit/test_universe_enrich_currency_preservation.py src/alpha_edge/market/snapshot_bronze_universe.py tests/unit/test_snapshot_bronze_universe.py src/alpha_edge/market/ingest_bronze_incremental.py tests/unit/test_ingest_bronze_incremental.py src/alpha_edge/market/build_silver_sessions_v3.py tests/unit/test_build_silver_sessions_v3.py src/alpha_edge/market/calendar_registry_v3.py tests/unit/test_calendar_registry_v3.py src/alpha_edge/market/silver_financial_evidence_v3.py tests/unit/test_silver_financial_evidence_v3.py src/alpha_edge/market/build_silver_financial_v3.py tests/unit/test_build_silver_financial_v3.py
