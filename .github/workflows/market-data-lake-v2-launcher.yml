name: Market Data Lake v2 - Six Asset Pilot Launcher

# This lightweight workflow is intentionally registered on the default
# branch. It runs the pilot source code from the integration branch only.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive Yahoo start date (YYYY-MM-DD)
        type: string
        required: true
        default: "2025-01-01"
      end_date:
        description: Exclusive Yahoo end date (YYYY-MM-DD)
        type: string
        required: true
        default: "2026-11-10"

permissions:
  contents: read

jobs:
  six-asset-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
    steps:
      - name: Checkout integration branch (not main)
        uses: actions/checkout@v4
        with:
          ref: integration/aea87-market-data-lake-v2
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integration/aea87-market-data-lake-v2"
          test -f src/alpha_edge/market/ingest_bronze_yahoo_v2.py
          test -f data/quality/market_lake_v2/pilot_six_assets.csv
          echo "Pilot source: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install project
        run: poetry install --no-interaction --no-ansi
      - name: Run Stage 1, Stage 2 and Stage 3 offline tests
        run: |
          poetry run pytest -q \
            tests/unit/test_data_lake_v2.py \
            tests/unit/test_ingest_bronze_yahoo_v2.py \
            tests/unit/test_standardize_bronze_v2.py \
            tests/unit/test_manual_observations_v2.py
      - name: Acquire original Yahoo prices and FX quotes
        shell: bash
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          [[ "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$START_DATE" < "$END_DATE" ]]
          poetry run python -m alpha_edge.market.ingest_bronze_yahoo_v2 \
            --universe-csv data/quality/market_lake_v2/pilot_six_assets.csv \
            --fx-symbols 'EURUSD=X;USDBRL=X;USDMXN=X' \
            --start "$START_DATE" --end "$END_DATE" \
            --batch-id six_asset_pilot \
            --output ./outputs/market_bronze_v2
      - name: Validate downloaded observations
        run: |
          poetry run python -m alpha_edge.market.validate_bronze_pilot_v2 \
            --batch-dir ./outputs/market_bronze_v2/six_asset_pilot
      - name: Build Stage 3 Silver/Gold candidate and quality diagnostics
        run: |
          poetry run python -m alpha_edge.market.run_standardization_pilot_v2 \
            --bronze-batch-dir ./outputs/market_bronze_v2/six_asset_pilot \
            --output ./outputs/market_silver_gold_v2/six_asset_pilot \
            --corrections-csv data/quality/market_lake_v2/manual_ohlcv_corrections.csv
      - name: Preserve Bronze and Silver/Gold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-lake-v2-six-asset-pilot
          path: |
            outputs/market_bronze_v2/
            outputs/market_silver_gold_v2/
          if-no-files-found: warn
          retention-days: 14
