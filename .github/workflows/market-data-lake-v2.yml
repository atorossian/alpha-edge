name: Market Data Lake v2 checks

on:
  push:
    branches:
      - integration/aea87-market-data-lake-v2
  pull_request:
    paths:
      - "src/alpha_edge/market/data_lake_v2.py"
      - "src/alpha_edge/market/run_data_lake_v2.py"
      - "src/alpha_edge/market/inspect_data_lake_v2.py"
      - "src/alpha_edge/market/ingest_bronze_yahoo_v2.py"
      - "src/alpha_edge/market/standardize_bronze_v2.py"
      - "src/alpha_edge/market/manual_observations_v2.py"
      - "src/alpha_edge/market/publish_lake_v2.py"
      - "src/alpha_edge/market/data_quality_explorer_v2.py"
      - "src/alpha_edge/market/reconcile_aea87_lake_v2.py"
      - "src/alpha_edge/market/export_aea87_for_reconciliation.py"
      - "src/alpha_edge/market/audit_corporate_actions_v2.py"
      - "src/alpha_edge/market/ingest_corporate_actions_v2.py"
      - "src/alpha_edge/market/reconcile_corporate_actions_v2.py"
      - "src/alpha_edge/market/independent_acceptance_v2.py"
      - "src/alpha_edge/market/compare_bronze_revisions_v2.py"
      - "src/alpha_edge/market/preflight_universe_v2.py"
      - "src/alpha_edge/market/source_evidence_v2.py"
      - "src/alpha_edge/market/run_cohort_bronze_v2.py"
      - "src/alpha_edge/market/audit_missing_ohlcv_v2.py"
      - "src/alpha_edge/market/prepare_full_universe_registry_v2.py"
      - "src/alpha_edge/market/run_full_history_backfill_v2.py"
      - "src/alpha_edge/market/run_s3_full_history_backfill_v2.py"
      - "src/alpha_edge/market/archive_local_outputs_v2.py"
      - "src/alpha_edge/market/publish_production_bronze_v2.py"
      - "src/alpha_edge/market/production_gold_release_v2.py"
      - "src/alpha_edge/market/run_daily_pipeline_v2.py"
      - "src/alpha_edge/market/prepare_initial_gold_v2.py"
      - "src/alpha_edge/market/independent_daily_quality_v2.py"
      - "src/alpha_edge/market/active_lake_v2.py"
      - ".gitignore"
      - "data/quality/market_lake_v2/exchange_calendar_mapping_v2.csv"
      - "src/alpha_edge/market/run_standardization_pilot_v2.py"
      - "data/quality/market_lake_v2/pilot_asset_registry_v2.csv"
      - "data/quality/market_lake_v2/pilot_fx_registry_v2.csv"
      - "src/alpha_edge/market/run_standardization_pilot_v2.py"
      - "data/quality/market_lake_v2/manual_ohlcv_corrections.csv"
      - "tests/unit/test_data_lake_v2.py"
      - "tests/unit/test_ingest_bronze_yahoo_v2.py"
      - "tests/unit/test_standardize_bronze_v2.py"
      - "tests/unit/test_manual_observations_v2.py"
      - "tests/unit/test_publish_lake_v2.py"
      - "tests/unit/test_data_quality_explorer_v2.py"
      - "tests/unit/test_reconcile_aea87_lake_v2.py"
      - "tests/unit/test_export_aea87_for_reconciliation.py"
      - "tests/unit/test_audit_corporate_actions_v2.py"
      - "tests/unit/test_corporate_actions_v2_pipeline.py"
      - "tests/unit/test_independent_acceptance_v2.py"
      - "tests/unit/test_compare_bronze_revisions_v2.py"
      - "tests/unit/test_preflight_universe_v2.py"
      - "tests/unit/test_source_evidence_v2.py"
      - "tests/unit/test_run_cohort_bronze_v2.py"
      - "tests/unit/test_audit_missing_ohlcv_v2.py"
      - "tests/unit/test_prepare_full_universe_registry_v2.py"
      - "tests/unit/test_run_full_history_backfill_v2.py"
      - "tests/unit/test_run_s3_full_history_backfill_v2.py"
      - "tests/unit/test_archive_local_outputs_v2.py"
      - "tests/unit/test_publish_production_bronze_v2.py"
      - "tests/unit/test_production_gold_release_v2.py"
      - "tests/unit/test_run_daily_pipeline_v2.py"
      - "tests/unit/test_prepare_initial_gold_v2.py"
      - "tests/unit/test_independent_daily_quality_v2.py"
      - "tests/unit/test_active_lake_v2.py"
      - ".github/workflows/market-data-lake-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Bronze and Silver/Gold unit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install project and test dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Compile new modules
        run: |
          poetry run python -m compileall -q \
            src/alpha_edge/market/data_lake_v2.py \
            src/alpha_edge/market/run_data_lake_v2.py \
            src/alpha_edge/market/inspect_data_lake_v2.py \
            src/alpha_edge/market/ingest_bronze_yahoo_v2.py \
            src/alpha_edge/market/standardize_bronze_v2.py \
            src/alpha_edge/market/run_standardization_pilot_v2.py \
            src/alpha_edge/market/manual_observations_v2.py \
            src/alpha_edge/market/publish_lake_v2.py \
            src/alpha_edge/market/data_quality_explorer_v2.py \
            src/alpha_edge/market/reconcile_aea87_lake_v2.py \
            src/alpha_edge/market/export_aea87_for_reconciliation.py \
            src/alpha_edge/market/audit_corporate_actions_v2.py \
            src/alpha_edge/market/ingest_corporate_actions_v2.py \
            src/alpha_edge/market/reconcile_corporate_actions_v2.py \
            src/alpha_edge/market/independent_acceptance_v2.py \
            src/alpha_edge/market/compare_bronze_revisions_v2.py \
            src/alpha_edge/market/preflight_universe_v2.py \
            src/alpha_edge/market/source_evidence_v2.py \
            src/alpha_edge/market/run_cohort_bronze_v2.py \
            src/alpha_edge/market/audit_missing_ohlcv_v2.py \
            src/alpha_edge/market/prepare_full_universe_registry_v2.py \
            src/alpha_edge/market/run_full_history_backfill_v2.py \
            src/alpha_edge/market/run_s3_full_history_backfill_v2.py \
            src/alpha_edge/market/archive_local_outputs_v2.py \
            src/alpha_edge/market/publish_production_bronze_v2.py \
            src/alpha_edge/market/production_gold_release_v2.py \
            src/alpha_edge/market/run_daily_pipeline_v2.py \
            src/alpha_edge/market/prepare_initial_gold_v2.py \
            src/alpha_edge/market/independent_daily_quality_v2.py \
            src/alpha_edge/market/active_lake_v2.py
      - name: Run offline unit tests
        run: |
          poetry run pytest -v \
            tests/unit/test_data_lake_v2.py \
            tests/unit/test_ingest_bronze_yahoo_v2.py \
            tests/unit/test_standardize_bronze_v2.py \
            tests/unit/test_manual_observations_v2.py \
            tests/unit/test_publish_lake_v2.py \
            tests/unit/test_data_quality_explorer_v2.py \
            tests/unit/test_reconcile_aea87_lake_v2.py \
            tests/unit/test_export_aea87_for_reconciliation.py \
            tests/unit/test_audit_corporate_actions_v2.py \
            tests/unit/test_corporate_actions_v2_pipeline.py \
            tests/unit/test_independent_acceptance_v2.py \
            tests/unit/test_compare_bronze_revisions_v2.py \
            tests/unit/test_preflight_universe_v2.py \
            tests/unit/test_source_evidence_v2.py \
            tests/unit/test_run_cohort_bronze_v2.py \
            tests/unit/test_audit_missing_ohlcv_v2.py \
            tests/unit/test_prepare_full_universe_registry_v2.py \
            tests/unit/test_run_full_history_backfill_v2.py \
            tests/unit/test_run_s3_full_history_backfill_v2.py \
            tests/unit/test_archive_local_outputs_v2.py \
            tests/unit/test_publish_production_bronze_v2.py \
            tests/unit/test_production_gold_release_v2.py \
            tests/unit/test_run_daily_pipeline_v2.py \
            tests/unit/test_prepare_initial_gold_v2.py \
            tests/unit/test_independent_daily_quality_v2.py \
            tests/unit/test_active_lake_v2.py
