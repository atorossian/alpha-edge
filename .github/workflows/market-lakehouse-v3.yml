name: Market lakehouse v3 - S3-only contracts

on:
  push:
    branches:
      - feature/market-lakehouse-v3-s3-only
    paths:
      - "src/alpha_edge/market/lakehouse_v3/**"
      - "tests/unit/test_market_lakehouse_v3.py"
      - ".github/workflows/market-lakehouse-v3.yml"
  pull_request:
    paths:
      - "src/alpha_edge/market/lakehouse_v3/**"
      - "tests/unit/test_market_lakehouse_v3.py"
      - ".github/workflows/market-lakehouse-v3.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Format and lint only the new implementation
        run: |
          poetry run ruff check --no-fix src/alpha_edge/market/lakehouse_v3 tests/unit/test_market_lakehouse_v3.py
          poetry run ruff format --diff\n          poetry run ruff format --check src/alpha_edge/market/lakehouse_v3 tests/unit/test_market_lakehouse_v3.py
      - name: Run in-memory S3 contract tests
        run: poetry run pytest -q tests/unit/test_market_lakehouse_v3.py
